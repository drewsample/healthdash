name: HealthDash
options:
  bundleIdPrefix: com.healthdash
  deploymentTarget:
    iOS: "17.0"

targets:
  HealthDash:
    type: application
    platform: iOS
    sources:
      - path: HealthDash
    info:
      path: HealthDash/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthdash.app
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: NO
        Release:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: NO

schemes:
  HealthDash:
    build:
      targets:
        HealthDash: all
    run:
      config: Debug
    archive:
      config: Release
