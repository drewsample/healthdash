workflows:
  unsigned-ipa:
    name: Unsigned IPA (SideStore)
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          set -e
          xcodegen generate
          echo "=== INFOPLIST settings in generated project ==="
          grep -i "INFOPLIST" HealthDash.xcodeproj/project.pbxproj | sort -u | head -20 || echo "NO INFOPLIST SETTINGS FOUND"
      - name: Build unsigned archive
        script: |
          set -e
          xcodebuild \
            -project HealthDash.xcodeproj \
            -scheme HealthDash \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/HealthDash.xcarchive" \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Verify Info.plist
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/HealthDash.xcarchive/Products/Applications/HealthDash.app"
          echo "=== Injecting usage descriptions directly ==="
          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string 'HealthDash writes your weight, steps, heart rate, SpO2, HRV, and sleep to Apple Health so they appear in the Health app.'" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string 'HealthDash writes your weight, steps, heart rate, SpO2, HRV, and sleep to Apple Health so they appear in the Health app.'" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'HealthDash uses Bluetooth to read your scale and smart ring locally. No data leaves your phone.'" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'HealthDash uses Bluetooth to read your scale and smart ring locally. No data leaves your phone.'" "$APP_PATH/Info.plist"
          echo "=== Verifying ==="
          plutil -p "$APP_PATH/Info.plist" | grep -iE "NSHealth|NSBluetooth" || (echo "INJECTION FAILED"; exit 1)
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/HealthDash.xcarchive/Products/Applications/HealthDash.app"
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -qry HealthDash-unsigned.ipa Payload
          rm -rf Payload
          ls -la HealthDash-unsigned.ipa
    artifacts:
      - HealthDash-unsigned.ipa
